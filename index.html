<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--Avoid timers throttling by browser when tab is inactive.-->
    <script src="./js/HackTimer.min.js"></script>
    <script src="./js/HackTimerWorker.min.js"></script>

    <title>自動更新YT最新影片</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://marsantony.github.io/shared/nav.css">
    <style>
        :root {
            --bg: #c8ccd6;
            --shadow-dark: #a0a4ae;
            --shadow-light: #f0f4fc;
            --text-primary: #2a3040;
            --text-secondary: #505868;
            --text-muted: #808898;
            --accent: #5a7aed;
            --danger: #c0392b;
            --success: #2d7a4f;

            --neu-raised: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            --neu-raised-sm: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            --neu-pressed: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.18) 0%, transparent 60%),
                repeating-linear-gradient(135deg, transparent 0px, transparent 2px, rgba(255,255,255,0.04) 2px, rgba(255,255,255,0.04) 4px),
                linear-gradient(135deg, #bcc0ca 0%, #d0d4de 50%, #c4c8d2 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding-top: 56px;
        }

        .container {
            max-width: 640px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .card {
            background: var(--bg);
            box-shadow: var(--neu-raised);
            border-radius: 18px;
            padding: 2rem;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: none;
            border-radius: 10px;
            background: var(--bg);
            box-shadow: var(--neu-pressed);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-primary);
            outline: none;
            transition: box-shadow 0.2s;
        }

        input[type="password"]:focus,
        input[type="text"]:focus {
            box-shadow: var(--neu-pressed), 0 0 0 2px var(--accent);
        }

        textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: none;
            border-radius: 10px;
            background: var(--bg);
            box-shadow: var(--neu-pressed);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-primary);
            resize: none;
            outline: none;
        }

        .label-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.4rem;
        }

        .label-row label {
            margin-bottom: 0;
        }

        .hint-link {
            font-size: 0.75rem;
            color: var(--accent);
            text-decoration: none;
        }

        .hint-link:hover {
            text-decoration: underline;
        }

        .jwt-hint {
            position: relative;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .jwt-hint img {
            display: none;
        }

        .jwt-hint:hover img {
            display: block;
            position: absolute;
            z-index: 10;
            max-width: 500px;
            border-radius: 8px;
            box-shadow: var(--neu-raised);
        }

        .btn-row {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.5rem 1.2rem;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: box-shadow 0.15s, transform 0.1s;
            background: var(--bg);
            box-shadow: var(--neu-raised-sm);
            color: var(--text-primary);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn:active {
            box-shadow: var(--neu-pressed);
            transform: translateY(0);
        }

        .btn-primary {
            color: var(--accent);
        }

        .btn-danger {
            color: var(--danger);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .alert-success {
            background: var(--bg);
            box-shadow: var(--neu-pressed);
            color: var(--success);
        }

        .alert-danger {
            background: var(--bg);
            box-shadow: var(--neu-pressed);
            color: var(--danger);
        }

        .reply-display {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            word-break: break-all;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid var(--shadow-dark);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 0.4rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        select {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: none;
            border-radius: 10px;
            background: var(--bg);
            box-shadow: var(--neu-pressed);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-primary);
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        select:focus {
            box-shadow: var(--neu-pressed), 0 0 0 2px var(--accent);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <h2>自動更新 YT 最新影片</h2>

            <div id="successAlert" class="alert alert-success"></div>
            <div id="errorAlert" class="alert alert-danger"></div>

            <div class="form-group">
                <label for="channel">頻道</label>
                <select id="channel">
                    <option value="shuteye_orange"
                        data-se-channel="5929d1f610ee005fd32bc0ea"
                        data-se-command="64e9fdca52bb6e45114f9753"
                        data-playlist="UULkKU_1n2UjZUCrz6zFKzAQ">蝦愛橘子</option>
                    <option value="marsantonymars"
                        data-se-channel="5d29b4d31deb300a0518a503"
                        data-se-command="64cfe4796b4f2ba47f03cd3d"
                        data-playlist="UULkKU_1n2UjZUCrz6zFKzAQ">姬柊雪菜我老婆</option>
                    <option value="__custom__">自訂...</option>
                </select>
            </div>

            <div id="customFields" style="display:none;">
                <div class="form-group">
                    <label for="customSeChannel">StreamElements Channel ID</label>
                    <input type="text" id="customSeChannel" />
                </div>
                <div class="form-group">
                    <label for="customSeCommand">StreamElements Command ID</label>
                    <input type="text" id="customSeCommand" />
                </div>
                <div class="form-group">
                    <label for="customPlaylist">YouTube Playlist ID</label>
                    <input type="text" id="customPlaylist" />
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="JWTKey">StreamElements JWT 金鑰</label>
                    <span class="jwt-hint" id="showJWTPlaceImage">ℹ️<img src="./images/image.png" width="500" /></span>
                    <a class="hint-link" href="https://streamelements.com/dashboard/account/channels" target="_blank">取得金鑰</a>
                </div>
                <input type="password" id="JWTKey" />
            </div>

            <div class="form-group">
                <label for="youtubeKey">YouTube 金鑰</label>
                <input type="password" id="youtubeKey" />
            </div>

            <div class="form-group">
                <label for="videoCount">影片個數</label>
                <input type="text" id="videoCount" value="1" />
            </div>

            <div class="btn-row">
                <button type="button" class="btn btn-primary" id="ImmediatelyUpdate">立即更新</button>
                <button type="button" class="btn btn-primary" id="FirstStartAutoUpdate">開始自動更新</button>
                <button type="button" class="btn btn-primary" id="loading" disabled style="display:none;">
                    <span class="spinner"></span>
                    <span class="loading-text" id="nextUpdateStamp">Loading...</span>
                </button>
                <button type="button" class="btn btn-primary" id="StartAutoUpdate" style="display:none;">開始自動更新</button>
                <button type="button" class="btn btn-danger" id="stopAutoUpdate" style="display:none;">停止自動更新</button>
            </div>

            <div class="form-group" style="margin-top: 1.5rem;">
                <label>YouTube 依照最新影片數的回應</label>
                <span class="reply-display" id="currentYoutubeReply"></span>
            </div>

            <div class="form-group">
                <label for="log">執行紀錄</label>
                <textarea id="log" rows="10" readonly></textarea>
            </div>
        </div>
    </div>

    <script src="https://marsantony.github.io/shared/shared.js"></script>
    <script type="module">
        import { buildYoutubeReplyString, parseVideoCount, needsUpdate, buildYoutubeApiUrl } from './src/youtube-utils.js';

        const STORAGE_JWTKEY = 'Youtube_AutoVideosUpdate_JWTKey';
        const STORAGE_YOUTUBEKEY = 'Youtube_AutoVideosUpdate_YoutubeKey';
        const STORAGE_CHANNEL = 'Youtube_AutoVideosUpdate_Channel';
        const STORAGE_CUSTOM_SE_CHANNEL = 'Youtube_AutoVideosUpdate_CustomSeChannel';
        const STORAGE_CUSTOM_SE_COMMAND = 'Youtube_AutoVideosUpdate_CustomSeCommand';
        const STORAGE_CUSTOM_PLAYLIST = 'Youtube_AutoVideosUpdate_CustomPlaylist';

        // DOM 快取
        const channelEl = document.getElementById('channel');
        const customFieldsEl = document.getElementById('customFields');
        const customSeChannelEl = document.getElementById('customSeChannel');
        const customSeCommandEl = document.getElementById('customSeCommand');
        const customPlaylistEl = document.getElementById('customPlaylist');
        const jwtKeyEl = document.getElementById('JWTKey');
        const youtubeKeyEl = document.getElementById('youtubeKey');
        const videoCountEl = document.getElementById('videoCount');
        const logEl = document.getElementById('log');
        const successAlertEl = document.getElementById('successAlert');
        const errorAlertEl = document.getElementById('errorAlert');
        const currentYoutubeReplyEl = document.getElementById('currentYoutubeReply');
        const immediatelyUpdateEl = document.getElementById('ImmediatelyUpdate');
        const firstStartEl = document.getElementById('FirstStartAutoUpdate');
        const startAutoEl = document.getElementById('StartAutoUpdate');
        const stopAutoEl = document.getElementById('stopAutoUpdate');
        const loadingEl = document.getElementById('loading');
        const nextUpdateStampEl = document.getElementById('nextUpdateStamp');

        // 將預設值帶入（JWT/API Key 用 sessionStorage，其餘用 localStorage）
        jwtKeyEl.value = sessionStorage.getItem(STORAGE_JWTKEY) || '';
        youtubeKeyEl.value = sessionStorage.getItem(STORAGE_YOUTUBEKEY) || '';
        channelEl.value = localStorage.getItem(STORAGE_CHANNEL) || channelEl.value;
        customSeChannelEl.value = localStorage.getItem(STORAGE_CUSTOM_SE_CHANNEL) || '';
        customSeCommandEl.value = localStorage.getItem(STORAGE_CUSTOM_SE_COMMAND) || '';
        customPlaylistEl.value = localStorage.getItem(STORAGE_CUSTOM_PLAYLIST) || '';

        // 頻道切換
        const updateCustomFields = () => {
            customFieldsEl.style.display = channelEl.value === '__custom__' ? '' : 'none';
        };
        updateCustomFields();
        channelEl.addEventListener('change', updateCustomFields);

        // 取得目前選擇的設定
        const getConfig = () => {
            const selected = channelEl.options[channelEl.selectedIndex];
            if (channelEl.value === '__custom__') {
                return {
                    seChannel: customSeChannelEl.value.trim(),
                    seCommand: customSeCommandEl.value.trim(),
                    playlist: customPlaylistEl.value.trim(),
                };
            }
            return {
                seChannel: selected.dataset.seChannel,
                seCommand: selected.dataset.seCommand,
                playlist: selected.dataset.playlist,
            };
        };

        const MAX_LOG_LINES = 200;
        let errorMsg = '';
        let mainInterval;

        const log = (message) => {
            const currentStamp = new Date().toLocaleString();
            console.log(currentStamp, message);
            const lines = logEl.value.split('\r\n');
            lines.unshift(`${currentStamp}:${JSON.stringify(message)}`);
            if (lines.length > MAX_LOG_LINES) lines.length = MAX_LOG_LINES;
            logEl.value = lines.join('\r\n');
        };

        const hideAll = () => {
            successAlertEl.style.display = 'none';
            errorAlertEl.style.display = 'none';
        };

        const showError = (message) => {
            successAlertEl.textContent = '';
            successAlertEl.style.display = 'none';
            errorAlertEl.textContent = message;
            errorAlertEl.style.display = '';
        };

        const showSuccess = (message) => {
            errorAlertEl.textContent = '';
            errorAlertEl.style.display = 'none';
            successAlertEl.textContent = message;
            successAlertEl.style.display = '';
        };

        // 取得 YouTube 最新 Video 資訊
        const getYoutubeLatestVideos = async (config) => {
            try {
                log('取得Youtube最新Video資訊');
                const videoCount = parseVideoCount(videoCountEl.value);
                const apiUrl = buildYoutubeApiUrl(youtubeKeyEl.value, videoCount, config.playlist);
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error(`${response.status}:${response.statusText}`);
                }
                const data = await response.json();
                log(data);
                return buildYoutubeReplyString(data['items']);
            } catch (error) {
                console.error('Error:', error);
                errorMsg = '無法取得Youtube最新Video資訊';
                throw error;
            }
        };

        // 取得目前指令的內容
        const getStreamelementsCommand = async (config) => {
            try {
                log('取得目前指令的內容');
                const response = await fetch(`https://api.streamelements.com/kappa/v2/bot/commands/${config.seChannel}/${config.seCommand}`, {
                    headers: {
                        'Accept': 'application/json; charset=utf-8, application/json',
                        'Authorization': `Bearer ${jwtKeyEl.value}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`${response.status}:${response.statusText}`);
                }
                const data = await response.json();
                log(data);
                return data;
            } catch (error) {
                console.error('Error:', error);
                errorMsg = '無法取得目前指令的內容';
                throw error;
            }
        };

        // 更新目前指令的內容
        const updateStreamelementsCommand = async (config, commandJson) => {
            try {
                log('更新目前指令的內容');
                const response = await fetch(`https://api.streamelements.com/kappa/v2/bot/commands/${config.seChannel}/${config.seCommand}`, {
                    method: 'PUT',
                    headers: {
                        'Accept': 'application/json; charset=utf-8, application/json',
                        'Authorization': `Bearer ${jwtKeyEl.value}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(commandJson),
                });
                if (!response.ok) {
                    throw new Error(`${response.status}:${response.statusText}`);
                }
                const data = await response.json();
                log(data);
                return data;
            } catch (error) {
                console.error('Error:', error);
                errorMsg = '無法更新目前指令的內容';
                throw error;
            }
        };

        // 完整流程
        const mainProcess = async () => {
            try {
                log('完整流程開始');
                hideAll();

                const config = getConfig();
                const [newReply, commandJson] = await Promise.all([
                    getYoutubeLatestVideos(config),
                    getStreamelementsCommand(config),
                ]);
                currentYoutubeReplyEl.textContent = newReply;

                if (!needsUpdate(commandJson['reply'], newReply))
                    return;

                commandJson['reply'] = newReply;

                // StreamElements 需要連續更新兩次才能生效
                await updateStreamelementsCommand(config, commandJson);
                const updatedCommandJson = await updateStreamelementsCommand(config, commandJson);

                showSuccess('更新成功：' + updatedCommandJson['reply']);
            } catch (error) {
                showError(errorMsg + ' — ' + error);
            } finally {
                log('完整流程結束');
            }
        };

        const saveSettings = () => {
            sessionStorage.setItem(STORAGE_JWTKEY, jwtKeyEl.value);
            sessionStorage.setItem(STORAGE_YOUTUBEKEY, youtubeKeyEl.value);
            localStorage.setItem(STORAGE_CHANNEL, channelEl.value);
            localStorage.setItem(STORAGE_CUSTOM_SE_CHANNEL, customSeChannelEl.value);
            localStorage.setItem(STORAGE_CUSTOM_SE_COMMAND, customSeCommandEl.value);
            localStorage.setItem(STORAGE_CUSTOM_PLAYLIST, customPlaylistEl.value);
        };

        immediatelyUpdateEl.addEventListener('click', async () => {
            saveSettings();
            await mainProcess();
        });

        firstStartEl.addEventListener('click', () => {
            saveSettings();
            firstStartEl.style.display = 'none';
            startAutoEl.style.display = 'none';
            stopAutoEl.style.display = 'none';
            startAutoEl.click();
        });

        startAutoEl.addEventListener('click', async () => {
            clearTimeout(mainInterval);
            loadingEl.style.display = '';
            startAutoEl.style.display = 'none';

            const autoUpdateDurationByDays = 1;

            const runMainProcess = async () => {
                await mainProcess();
                const now = new Date();
                now.setDate(now.getDate() + autoUpdateDurationByDays);
                nextUpdateStampEl.textContent = `下次自動更新：${now.toLocaleString()}`;
                mainInterval = setTimeout(runMainProcess, autoUpdateDurationByDays * 24 * 60 * 60 * 1000);
            };
            await runMainProcess();

            firstStartEl.style.display = 'none';
            startAutoEl.style.display = 'none';
            stopAutoEl.style.display = '';
        });

        stopAutoEl.addEventListener('click', () => {
            clearTimeout(mainInterval);
            firstStartEl.style.display = 'none';
            startAutoEl.style.display = '';
            stopAutoEl.style.display = 'none';
            nextUpdateStampEl.textContent = 'Loading...';
            loadingEl.style.display = 'none';
        });
    </script>
</body>

</html>
